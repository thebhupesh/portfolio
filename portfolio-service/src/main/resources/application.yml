spring:
  application:
    name: portfolio-service

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  
aws:
  region: ${AWS_REGION}
  dynamodb:
    table-name: ${AWS_DYNAMODB_TABLE_NAME}
  sqs:
    message-queue-url: ${AWS_SQS_MESSAGE_QUEUE_URL}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}

security:
  bcrypt-strength: ${SECURITY_BCRYPT_STRENGTH}
  credentials:
    record-type: ${SECURITY_CREDENTIALS_RECORD_TYPE:credential}
  jwt:
    signing-key-base64: ${JWT_SIGNING_KEY}
    ttl: ${JWT_TOKEN_TTL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

